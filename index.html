"<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Card de Perfil</title>
    <style>
        body {
            background-color: #121214;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background-image: linear-gradient(135deg, #2e1065, #1e3a8a);
            color: #ffffff;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            width: 280px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
           
        }  .foto-perfil {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid #8257e5;
            margin-bottom: 16px;
            object-fit: cover;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 4px;
            color: #ffffff;
        }
        


        h2 {
            font-size: 14px;
            font-weight: normal;
            color: #04d361;
            margin-top: 0;
            margin-bottom: 16px;
        }

        p {
            font-size: 14px;
            color: #a8a8b3;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .botao {
            display: inline-block;
            background-image: linear-gradient(to right, #8257e5, #0070f3);
            border: none;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 12px;
            width: 80%
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="minhafoto.jpg" class="foto-perfil" alt="Minha Foto">
        
        <h1>Taís de Jesus Rodrigues</h1>
        <h2>Futura Dev Full Stack</h2>
        <p>Estudante de Sistemas para Internet na Fatec. Apaixonada por design de interfaces e tecnologia, ainda aprendendo.</p>
        <a href="https://instagram.com" class="botao">Ver Instagram</a>
        
        <a href="https://linkedin.com" class="botao">Ver LinkedIn</a>
        

</body>
</html>
